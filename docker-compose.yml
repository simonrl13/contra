# Stage 1: database only. The app container is added in Stage 6.
# Variables come from .env (compose reads it automatically).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contra
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Bound to localhost only, so the database isn't reachable from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d contra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
