AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions in one repository deploy contra-api without long-lived AWS keys (OIDC).
  Deploy after infra/app.yml. See docs/aws.md.

Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: owner/name of the repository allowed to deploy, e.g. your-user/contra-api
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: '"false" if this account already has the token.actions.githubusercontent.com provider.'
  AppStackName:
    Type: String
    Default: contra-api
    Description: Name of the stack created from infra/app.yml (its execution role is looked up by name below).

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: contra-api-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                # Only jobs of this one repository that run in its "aws" GitHub environment. Restrict that
                # environment to the main branch in GitHub (Settings > Environments > Deployment branches).
                # A fork, another branch or another repository can't assume this role.
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepository}:environment:aws"
      Policies:
        - PolicyName: push-image-and-update-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthToken # no resource-level permissions for this action
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyToThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/contra-api"
              - Sid: TaskDefinitions # Register/Describe don't support resource-level permissions
                Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Sid: UpdateOnlyThisService
                Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/contra-api/contra-api"
              - Sid: HandTheExecutionRoleToEcsOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-TaskExecutionRole-*"
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN (a variable, not a secret; it isn't sensitive).
